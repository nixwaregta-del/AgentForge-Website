<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#16181d"/>
      <stop offset="50%" style="stop-color:#0f1116"/>
      <stop offset="100%" style="stop-color:#0a0c10"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3f4f6"/>
      <stop offset="50%" style="stop-color:#9ca3af"/>
      <stop offset="100%" style="stop-color:#e5e7eb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="50%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Subtle grid texture -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Side accent lines -->
  <rect x="56" y="40" width="3" height="320" fill="url(#accent)" opacity="0.9"/>
  <rect x="1141" y="40" width="3" height="320" fill="url(#accent)" opacity="0.9"/>

  <!-- Decorative gears -->
  <g transform="translate(190, 200)" filter="url(#shadow)">
    <path fill="#4b5563" d="M0,-110 l10,-10 10,10 10,-10 10,10 10,-10 10,10 10,-10 10,10 10,-10 10,10 10,-10 10,10 10,-10 10,10 0,110 -10,-10 -10,10 -10,-10 -10,10 -10,-10 -10,10 -10,-10 -10,10 -10,-10 -10,10 -10,-10 -10,10 z"/>
    <circle cx="0" cy="0" r="70" fill="#11151c"/>
    <circle cx="0" cy="0" r="55" fill="#1f2533"/>
    <circle cx="0" cy="0" r="18" fill="#9ca3af"/>
  </g>
  <g transform="translate(1010, 200)" filter="url(#shadow)">
    <path fill="#4b5563" d="M0,-110 l10,-10 10,10 10,-10 10,10 10,-10 10,10 10,-10 10,10 10,-10 10,10 10,-10 10,10 10,-10 10,10 0,110 -10,-10 -10,10 -10,-10 -10,10 -10,-10 -10,10 -10,-10 -10,10 -10,-10 -10,10 -10,-10 -10,10 z"/>
    <circle cx="0" cy="0" r="70" fill="#11151c"/>
    <circle cx="0" cy="0" r="55" fill="#1f2533"/>
    <circle cx="0" cy="0" r="18" fill="#9ca3af"/>
  </g>

  <!-- Central metallic star -->
  <g transform="translate(420, 200)" filter="url(#glow)">
    <polygon points="0,-115 35,-35 115,-35 50,20 70,100 0,55 -70,100 -50,20 -115,-35 -35,-35" fill="url(#metal)"/>
    <polygon points="0,-95 25,-25 90,-25 40,15 55,80 0,45 -55,80 -40,15 -90,-25 -25,-25" fill="#6b7280"/>
    <polygon points="0,-75 18,-18 65,-18 30,12 40,60 0,35 -40,60 -30,12 -65,-18 -18,-18" fill="#9ca3af"/>
    <polygon points="0,-55 12,-12 45,-12 20,8 28,45 0,25 -28,45 -20,8 -45,-12 -12,-12" fill="#e5e7eb"/>
    <circle cx="0" cy="0" r="14" fill="#11151c"/>
    <circle cx="0" cy="0" r="8" fill="#34d399"/>
  </g>

  <!-- Title -->
  <text x="680" y="170" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="72" font-weight="800" fill="#e5e7eb" filter="url(#shadow)">AgentForge</text>
  <text x="680" y="168" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="72" font-weight="800" fill="url(#accent)" opacity="0.9">AgentForge</text>

  <!-- Subtitle -->
  <text x="680" y="215" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="500" fill="#9ca3af" letter-spacing="3">FREE AI AGENT FOR ROBLOX STUDIO</text>

  <!-- Version tag -->
  <text x="680" y="255" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" fill="#6b7280" letter-spacing="2">v2.8  ·  BRIDGE + EXTENSION</text>

  <!-- Bottom rule -->
  <line x1="680" y1="280" x2="1120" y2="280" stroke="#4b5563" stroke-width="1"/>
  <line x1="680" y1="282" x2="1080" y2="282" stroke="#1f2533" stroke-width="1"/>

  <!-- Corner marks -->
  <g stroke="#6b7280" stroke-width="1" opacity="0.6">
    <path d="M 40 60 L 40 40 L 60 40"/>
    <path d="M 1140 60 L 1160 60 L 1160 40"/>
    <path d="M 40 340 L 40 360 L 60 360"/>
    <path d="M 1140 340 L 1160 340 L 1160 360"/>
  </g>
</svg>